{% if page_url %}
{% if description %}<meta name="description" content="{{ description }}" />{% endif %}
<meta property="og:type" content="website" />
<meta property="og:locale" content="pt_BR" />
<meta property="og:site_name" content="{{ site_name }}" />
<meta property="og:title" content="{{ title }}" />
{% if description %}<meta property="og:description" content="{{ description }}" />{% endif %}
<meta property="og:url" content="{{ page_url }}" />
{% if image_url %}<meta property="og:image" content="{{ image_url }}" />
{% if dimensions %}<meta property="og:image:type" content="image/png" />
<meta property="og:image:width" content="{{ dimensions.0 }}" />
<meta property="og:image:height" content="{{ dimensions.1 }}" />{% endif %}
<meta property="og:image:alt" content="{{ image_alt }}" />
{% endif %}
<meta name="twitter:card" content="{% if image_url %}summary_large_image{% else %}summary{% endif %}" />
<meta name="twitter:title" content="{{ title }}" />
{% if description %}<meta name="twitter:description" content="{{ description }}" />{% endif %}
{% if image_url %}<meta name="twitter:image" content="{{ image_url }}" />
<meta name="twitter:image:alt" content="{{ image_alt }}" />{% endif %}
{% endif %}
